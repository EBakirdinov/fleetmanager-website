<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="6" fill="#2563eb"/>
  <!-- Truck body (cargo box) -->
  <rect x="3" y="10" width="17" height="11" rx="2" fill="#ffffff"/>
  <!-- Truck cab -->
  <path d="M20 14 L20 21 L29 21 L29 17 L26 14 Z" fill="#ffffff"/>
  <!-- Cab window -->
  <path d="M21.5 15 L21.5 17 L27 17 L25 15 Z" fill="#2563eb"/>
  <!-- Front bumper -->
  <rect x="27" y="20" width="2" height="1.5" rx="0.5" fill="#bfdbfe"/>
  <!-- Wheels -->
  <circle cx="8" cy="22.5" r="3" fill="#1e3a5f"/>
  <circle cx="8" cy="22.5" r="1.5" fill="#93c5fd"/>
  <circle cx="23" cy="22.5" r="3" fill="#1e3a5f"/>
  <circle cx="23" cy="22.5" r="1.5" fill="#93c5fd"/>
  <!-- Undercarriage line -->
  <line x1="3" y1="21" x2="29" y2="21" stroke="#bfdbfe" stroke-width="0.5"/>
</svg>
